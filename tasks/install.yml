---
- name: Ensure MRS paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ mrs_uid }}"
    group: "{{ mrs_gid }}"
  with_items:
    - "{{ mrs_base_path }}"
    - "{{ mrs_data_path }}"

- name: Ensure MRS support files created
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ mrs_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ mrs_uid }}"
    group: "{{ mrs_gid }}"
  with_items:
    - env
    - labels
  register: mrs_support_files_result

- name: Ensure MRS configuration file installed
  ansible.builtin.copy:
    content: "{{ mrs_configuration | to_nice_yaml(indent=2, width=999999) }}"
    dest: "{{ mrs_base_path }}/config.yml"
    mode: "0640"
    owner: "{{ mrs_uid }}"
    group: "{{ mrs_gid }}"
  register: mrs_config_file_result

- name: Run if self-building of MRS container image is not enabled
  when: "not mrs_container_image_self_build | bool"
  block:
    - name: Ensure MRS container image is pulled via community.docker.docker_image_pull
      when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
      community.docker.docker_image_pull:
        name: "{{ mrs_container_image }}"
        pull: always
      register: mrs_container_image_pull_result_ansible_module
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: mrs_container_image_pull_result_ansible_module is not failed

    - name: Ensure MRS container image is pulled via ansible.builtin.command
      when: devture_systemd_docker_base_container_image_pull_method == 'command'
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ mrs_container_image }}"
      register: mrs_container_image_pull_result_command
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: mrs_container_image_pull_result_command is not failed
      changed_when: "'Downloaded newer image' in mrs_container_image_pull_result_command.stdout"

- name: Run if self-building of MRS container image is enabled
  when: "mrs_container_image_self_build | bool"
  block:
    - name: Ensure MRS repository is present on self-build
      ansible.builtin.git:
        repo: "{{ mrs_container_image_self_build_repo }}"
        version: "{{ mrs_container_image_self_build_repo_version }}"
        dest: "{{ mrs_container_image_self_build_src_files_path }}"
        force: "yes"
      register: mrs_git_pull_results

    - name: Ensure MRS container image is built
      community.docker.docker_image_build:
        name: "{{ mrs_container_image_self_build_name }}"
        dockerfile: Dockerfile
        path: "{{ mrs_container_image_self_build_src_files_path }}"
        pull: true
        rebuild: "{{ 'always' if mrs_git_pull_results.changed | bool else 'never' }}"
      register: mrs_container_image_build_result

- name: Ensure MRS container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ mrs_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: mrs_network_creation_result

- name: Ensure MRS container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ mrs_container_network }}
  register: mrs_network_creation_result
  changed_when: mrs_network_creation_result.rc == 0
  failed_when: mrs_network_creation_result.rc != 0 and 'already exists' not in mrs_network_creation_result.stderr

- name: Ensure MRS systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/mrs.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ mrs_identifier }}.service"
    mode: "0644"
  register: mrs_systemd_service_result

- name: Determine whether MRS needs a restart
  ansible.builtin.set_fact:
    mrs_restart_necessary: >-
      {{
        mrs_support_files_result.changed | default(false)
        or mrs_config_file_result.changed | default(false)
        or mrs_systemd_service_result.changed | default(false)
        or mrs_container_image_pull_result_ansible_module.changed | default(false)
        or mrs_container_image_pull_result_command.changed | default(false)
        or mrs_container_image_build_result.changed | default(false)
      }}
