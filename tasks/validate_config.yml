---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "mrs_data_dir_path", "new": "mrs_data_path" }
    - { "old": "mrs_container_http_bind_port", "new": "mrs_container_http_host_bind_port" }
    - { "old": "mrs_systemd_required_systemd_services_list", "new": "mrs_systemd_required_services_list" }
    - { "old": "mrs_container_additional_environment_variables", "new": "+mrs_environment_variables_additional_variables" }
    - { "old": "mrs_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required MRS settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - mrs_uid
    - mrs_gid
    - mrs_hostname
    - mrs_container_network

- name: Fail if required MRS + Traefik integration settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) when `mrs_container_labels_traefik_enabled`
  when: "mrs_container_labels_traefik_enabled | bool and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - mrs_container_labels_traefik_docker_network
