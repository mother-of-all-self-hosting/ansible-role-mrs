---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "mrs_data_dir_path", "new": "mrs_data_path" }
    - { "old": "mrs_container_http_bind_port", "new": "mrs_container_http_host_bind_port" }
    - { "old": "mrs_systemd_required_systemd_services_list", "new": "mrs_systemd_required_services_list" }
    - { "old": "mrs_admin_login", "new": "mrs_auth_admin_login" }
    - { "old": "mrs_admin_password", "new": "mrs_auth_admin_password" }
    - { "old": "mrs_admin_ips", "new": "mrs_auth_admin_ips" }
    - { "old": "mrs_container_additional_environment_variables", "new": "mrs_environment_variables_additional_variables" }
    - { "old": "mrs_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required MRS settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - mrs_uid
    - mrs_gid
    - mrs_hostname
    - mrs_container_network

- name: Fail if required MRS + Traefik integration settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) when `mrs_container_labels_traefik_enabled`
  when: "mrs_container_labels_traefik_enabled | bool and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - mrs_container_labels_traefik_docker_network

# MRS compares the credentials a caller presents against the configured login
# and password with a plain equality check, and an empty login together with an
# empty password compares equal to an empty login and an empty password. A
# caller sending `Authorization: Basic Og==` is therefore let straight through
# any API group whose credentials were left empty, unless that group also
# carries an IP allowlist (an empty `*_ips` list means "any address").
#
# The role cannot fix this by refusing to install without credentials, as that
# would break existing deployments, so it points the problem out instead.
- name: Reset the list of MRS API groups left open to anonymous callers
  ansible.builtin.set_fact:
    mrs_auth_open_groups: []

- name: Determine which MRS API groups are left open to anonymous callers
  ansible.builtin.set_fact:
    mrs_auth_open_groups: >-
      {{
        mrs_auth_open_groups
        +
        (
          [item]
          if (
            lookup('vars', 'mrs_auth_' + item + '_login', default='') | string | length == 0
            and lookup('vars', 'mrs_auth_' + item + '_password', default='') | string | length == 0
            and lookup('vars', 'mrs_auth_' + item + '_ips', default=[]) | length == 0
          )
          else []
        )
      }}
  with_items:
    - admin
    - catalog
    - discovery
    - metrics
    - moderation

- name: Inject the message about MRS API groups left open to anonymous callers
  when: mrs_auth_open_groups | length > 0
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: the MRS API groups "
          + (mrs_auth_open_groups | join(', '))
          + " have neither credentials (`mrs_auth_<group>_login` / `mrs_auth_<group>_password`) nor an IP allowlist (`mrs_auth_<group>_ips`) configured."
          + " MRS accepts an empty login together with an empty password as a valid credential, so these endpoints are reachable by anyone who can reach `"
          + mrs_hostname
          + "`. See the `Protecting the API groups` section of the role's README for what each group covers."
        ]
      }}
