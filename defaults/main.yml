---

mrs_enabled: false  # Not enabled by default, as it is not quite expected to be integrated to mash-playbook.

mrs_identifier: mrs
mrs_base_path: "/mrs"
mrs_data_path: "{{ mrs_base_path }}/data"

mrs_version: v0.1.0

mrs_uid: ""
mrs_gid: ""

# The hostname at which Matrix Rooms Search API is served.
mrs_hostname: ""

mrs_container_image: "{{ mrs_container_image_registry_prefix }}etkecc/mrs:{{ mrs_container_image_tag }}"
mrs_container_image_tag: "{{ mrs_version }}"
mrs_container_image_registry_prefix: "{{ mrs_container_image_registry_prefix_upstream }}"
mrs_container_image_registry_prefix_upstream: "{{ mrs_container_image_registry_prefix_upstream_default }}"
mrs_container_image_registry_prefix_upstream_default: ghcr.io/
mrs_container_image_force_pull: "{{ mrs_container_image.endswith(':latest') }}"

mrs_container_image_self_build: false
mrs_container_image_self_build_name: "etkecc/mrs:{{ mrs_container_image_self_build_repo_version }}"
mrs_container_image_self_build_repo: "https://github.com/etkecc/mrs.git"
mrs_container_image_self_build_repo_version: "{{ mrs_version if mrs_version != 'latest' else 'main' }}"
mrs_container_image_self_build_src_files_path: "{{ mrs_base_path }}/docker-src"

# The base container network. It will be auto-created by this role if it doesn't exist already.
mrs_container_network: "{{ mrs_identifier }}"

# Control if the container network is deleted on uninstalling.
mrs_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `mrs_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
mrs_container_http_bind_port: ""

# The port number in the container
mrs_container_http_port: 8080

# The HTTP address the container will listen on, leave empty to listen on all addresses (intended to be used as-is).
mrs_container_http_address: ""

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
mrs_container_additional_networks: "{{ mrs_container_additional_networks_auto + mrs_container_additional_networks_custom }}"
mrs_container_additional_networks_auto: []
mrs_container_additional_networks_custom: []

# mrs_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `mrs_container_labels_additional_labels_custom`.
mrs_container_labels_traefik_enabled: true
mrs_container_labels_traefik_docker_network: ""
mrs_container_labels_traefik_rule: "Host(`{{ mrs_hostname }}`)"
mrs_container_labels_traefik_entrypoints: web-secure
mrs_container_labels_traefik_tls: "{{ mrs_container_labels_traefik_entrypoints != 'web' }}"
mrs_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# mrs_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `mrs_container_labels_additional_labels_custom`
#
# Example:
# mrs_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
mrs_container_labels_additional_labels: "{{ mrs_container_labels_additional_labels_auto + mrs_container_labels_additional_labels_custom }}"
mrs_container_labels_additional_labels_auto: []
mrs_container_labels_additional_labels_custom: []

# Specify the size of the container's tmpfs volume
mrs_container_tmpfs_tmp_size: 512m

# A list of extra arguments to pass to the container (`docker create` command)
mrs_container_extra_arguments: "{{ mrs_container_extra_arguments_auto + mrs_container_extra_arguments_custom }}"
mrs_container_extra_arguments_auto: []
mrs_container_extra_arguments_custom: []

# List of systemd services that the MRS systemd service depends on
mrs_systemd_required_services_list: "{{ mrs_systemd_required_services_list_default + mrs_systemd_required_services_list_auto + mrs_systemd_required_services_list_custom }}"
mrs_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
mrs_systemd_required_services_list_auto: []
mrs_systemd_required_services_list_custom: []

# List of systemd services that the MRS systemd service wants
mrs_systemd_wanted_services_list: "{{ mrs_systemd_wanted_services_list_default + mrs_systemd_wanted_services_list_auto + mrs_systemd_wanted_services_list_custom }}"
mrs_systemd_wanted_services_list_default: []
mrs_systemd_wanted_services_list_auto: []
mrs_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
mrs_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
mrs_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
mrs_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
mrs_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ mrs_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ mrs_container_stop_grace_time_seconds }} {{ mrs_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ mrs_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ mrs_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ mrs_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ mrs_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ mrs_identifier }} after {{ mrs_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

mrs_sentry_dsn: ""
mrs_healthchecks_url: 'https://hc-ping.com'
mrs_healthchecks_uuid: ""

mrs_public_name: MRS
mrs_public_ui: "https://{{ mrs_hostname }}"
mrs_public_api: "https://{{ mrs_hostname }}"

# matrix server config
mrs_matrix_server_name: ""
mrs_matrix_support_contacts: []
mrs_matrix_support_page: ""
mrs_matrix_keys: []

# search config
mrs_search_defaults_limit: 10
mrs_search_defaults_offset: 0
mrs_search_defaults_sort_by: "-_score"

# admin credentials
mrs_auth_admin_login: ""
mrs_auth_admin_password: ""
# list of IPs allowed to access admin endpoints
mrs_auth_admin_ips: []

# metrics credentials
mrs_auth_metrics_login: ""
mrs_auth_metrics_password: ""
# list of IPs allowed to access metrics endpoints
mrs_auth_metrics_ips: []

# catalog credentials
mrs_auth_catalog_login: ""
mrs_auth_catalog_password: ""
# list of IPs allowed to access catalog endpoints
mrs_auth_catalog_ips: []

# discovery credentials
mrs_auth_discovery_login: ""
mrs_auth_discovery_password: ""
# list of IPs allowed to access discovery endpoints
mrs_auth_discovery_ips: []

# moderation credentials
mrs_auth_moderation_login: ""
mrs_auth_moderation_password: ""
# list of IPs allowed to access moderation endpoints
mrs_auth_moderation_ips: []

# webhooks
mrs_webhooks_moderation: ""
mrs_webhooks_stats: ""

# CORS
mrs_cors_allow_origins: ['*']
mrs_cors_allow_methods: ['GET', 'POST']
mrs_cors_allow_headers: ['*']
mrs_cors_max_age: 0

# cache
mrs_cache_max_age: 0
mrs_cache_max_age_search: 0
mrs_cache_bunny_url: ""
mrs_cache_bunny_key: ""

# plausible.io
mrs_plausible_host: ""
mrs_plausible_domain: ""

# cron
mrs_cron_discovery: ""
mrs_cron_parsing: ""
mrs_cron_indexing: ""
mrs_cron_full: ""

# paths inside container
mrs_path_index: "/mnt/data/index"
mrs_path_data: "/mnt/data/data.db"
mrs_path_media: "/mnt/data/media"
mrs_path_config: "/mnt/config.yml"

# batches config
mrs_batch_rooms: 10000

# workers config
mrs_workers_discovery: 20
mrs_workers_parsing: 5

# mod email
mrs_email_moderation: ""

# postmark config
mrs_email_postmark_server_token: ""

# postmark config for reports
mrs_email_postmark_report_message_stream: ""
mrs_email_postmark_report_from: ""

# email templates (report)
mrs_email_templates_report_subject: "{% raw %}{{ .Public.Name }}: Room {{ .Room.ID }} has been reported{% endraw %}"
mrs_email_templates_report_body: |-
  {% raw %}Hello,

  The room "[{{ .Room.ID }}](https://matrix.to/#/{{ .Room.ID }})" has been reported
  on [{{ .Public.Name }}]({{ .Public.UI }}) (a [Matrix Rooms Search](https://gitlab.com/etke.cc/mrs/api) instance).

  Reporter provided the following reason:

  ```
  {{ .Reason }}
  ```

  ---

  This automatic email was sent by [{{ .Public.Name }}]({{ .Public.UI }}) (a [Matrix Rooms Search](https://gitlab.com/etke.cc/mrs/api) instance) because you listed that email address as contact point (Matrix MSC1929 proposal).
  If you have any questions - please, use the [{{ .Public.Name }}]({{ .Public.UI }}) website.{% endraw %}

# language detection config
mrs_languages:
  - EN
  - DE

# servers bootstrap
mrs_servers: []

# ips to reject requests from
mrs_blocklist_ips: []
# servers to avoid
mrs_blocklist_servers: []
# words to avoid in search
mrs_blocklist_queries: []

# Default MRS configuration template which covers the generic use case.
# You can customize it by controlling the various variables inside it.
#
# For a more advanced customization, you can extend the default (see `mrs_configuration_yaml`)
# or completely replace this variable with your own template.
mrs_configuration_yaml: "{{ lookup('template', 'templates/config.yml.j2') }}"

mrs_configuration_extension_yaml: |
  # Your custom YAML configuration for MRS goes here.
  # This configuration extends the default starting configuration (`mrs_configuration_yaml`).
  #
  # You can override individual variables from the default configuration, or introduce new ones.
  #
  # If you need something more special, you can take full control by
  # completely redefining `mrs_configuration_yaml`.

mrs_configuration_extension: "{{ mrs_configuration_extension_yaml | from_yaml if mrs_configuration_extension_yaml | from_yaml is mapping else {} }}"

# Holds the final MRS configuration (a combination of the default and its extension).
# You most likely don't need to touch this variable. Instead, see `mrs_configuration_yaml`.
mrs_configuration: "{{ mrs_configuration_yaml | from_yaml | combine(mrs_configuration_extension, recursive=True) }}"

# Specify the timezone
mrs_environment_variables_tz: UTC

# mrs_environment_variables_additional_variables contains a multiline string with additional environment variables to pass to the container.
#
# Example:
# mrs_environment_variables_additional_variables: |
#   VAR=1
#   ANOTHER=value
mrs_environment_variables_additional_variables: ""

# mrs_restart_necessary controls whether the MRS systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
mrs_restart_necessary: false
