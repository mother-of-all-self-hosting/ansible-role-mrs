---
- name: Verify MRS systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for MRS service to become active (up to 180s)
      ansible.builtin.systemd:
        name: mrs.service
      register: mrs_service
      until: mrs_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert MRS service is active
      ansible.builtin.assert:
        that: mrs_service.status.ActiveState == 'active'
        fail_msg: "mrs.service not active ({{ mrs_service.status.ActiveState }})"
        success_msg: "mrs.service is active"

    - name: Retrieve MRS service log for debugging
      when: mrs_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu mrs.service
      changed_when: false

    - name: Wait for MRS HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:8080/_health"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: mrs_endpoint
      until: mrs_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert MRS HTTP endpoint responds
      ansible.builtin.assert:
        that: mrs_endpoint.status in [200, 302]
        fail_msg: "MRS did not respond as expected ({{ mrs_endpoint.status | default('no response') }})"
        success_msg: "MRS responded with {{ mrs_endpoint.status }}"

    - name: Show MRS systemd service status summary
      ansible.builtin.debug:
        msg:
          - "MRS systemd: {{ mrs_service.status.ActiveState }}"
          - "MRS HTTP: {{ mrs_endpoint.status }}"
